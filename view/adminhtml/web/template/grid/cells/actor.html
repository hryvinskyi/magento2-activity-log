<div class="activity-actor">
    <button type="button" class="activity-link activity-actor__name"
            click="$col.filterByActor.bind($col, $row())"
            attr="title: $t('Filter by actor')"
            text="$row().actor_name"></button>
    <span class="activity-actor__type" if="$col.showsType($row())" text="$col.typeLabel($row())"></span>
    <span class="activity-actor__via" if="$col.isDelegated($row())">
        <span translate="'via'"></span>
        <span class="activity-badge activity-badge--small" if="$col.hasViaChannel($row())"
              ko-style="$col.viaChannelStyle($row())" text="$col.viaChannelLabel($row())"></span>
        <span class="activity-actor__client" text="$row().via_client"></span>
    </span>
</div>
