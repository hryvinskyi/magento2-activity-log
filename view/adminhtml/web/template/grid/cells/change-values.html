<div class="activity-change-values">
    <!-- ko if: $col.isInline($row()) -->
    <span class="activity-change-values__before"
          css="'activity-change-values__value--empty': $col.beforeIsEmpty($row())"
          text="$col.before($row())"></span>
    <span class="activity-change-values__arrow" aria-hidden="true">→</span>
    <span class="activity-change-values__after"
          css="'activity-change-values__value--empty': $col.afterIsEmpty($row())"
          text="$col.after($row())"></span>
    <!-- /ko -->
    <span class="activity-change-values__note" if="$col.note($row())" text="$col.note($row())"></span>
</div>
